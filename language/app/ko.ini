; SilentZIP 语言文件 · 简体中文
;
; 格式：key = value
; 分号开头的行是注释，空行会被忽略
; 想改界面文字，直接改等号右边的内容就行
;
; 想加新语言：复制这个文件，改名成 zh-Hant.ini / en.ini 之类，
; 然后在 app 的偏好里切换。

[app]
name = SilentZIP
tagline = macOS 압축 관리 프로그램

[toolbar]
open = 압축 파일 열기
addFiles = 선택한 항목을 압축해 새 파일 만들기
addToArchive = 현재 압축 파일에 파일 추가
extract = 선택한 항목 압축 풀기
test = 무결성 검사
copy = 선택한 항목을 압축 파일 안의 다른 경로로 복사
move = 선택한 항목 이동 또는 이름 변경
delete = 선택한 항목 삭제
info = 압축 파일 정보 보기

[place]
desktop = 데스크톱
downloads = 다운로드
documents = 문서
home = 홈
root = 루트
up = 상위 폴더

[column]
colName = 이름
colType = 종류
colSize = 크기
colPacked = 압축 후
colModified = 수정한 날짜
colCRC = CRC

[type]
folder = 폴더
app = 응용 프로그램
symlink = 심볼릭 링크
archive = 압축 파일

[status]
noArchive = 압축 파일을 선택하거나 여기로 끌어다 놓으세요
reading = 읽는 중…
extracting = 압축 푸는 중…
compressing = 압축하는 중…
testing = 검사 중…
entries = 개 항목

[menu]
about = SilentZIP 정보
setDefault = 기본 압축 도구로 설정
installCLI = 명령줄 도구 설치…
terms = 사용 허가

[context]
ctxOpen = 열기
openAsArchive = 압축 파일로 열기
extractHere = 여기에 압축 풀기
compress7z = 7z로 압축…
compressZip = zip으로 압축…
revealInFinder = Finder에서 보기
moveToTrash = 휴지통으로 이동
expandNested = 안에 있는 압축 파일 열기

[about]
license = 독점 사용 허가 계약
viewFullTerms = 전문 보기
tech = 기술 정보
linkLabel = 전문 보기

[lock]
protected = 시스템 폴더는 보호되어 있어 쓸 수 없습니다
protectedDelete = 시스템 폴더는 보호되어 있어 지울 수 없습니다

[error]
noEngine = 7-Zip 엔진을 찾을 수 없습니다
addFailed = 추가하지 못했습니다
extractFailed = 압축을 풀지 못했습니다
openFailed = 열지 못했습니다
