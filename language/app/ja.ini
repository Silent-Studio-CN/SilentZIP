; SilentZIP 语言文件 · 简体中文
;
; 格式：key = value
; 分号开头的行是注释，空行会被忽略
; 想改界面文字，直接改等号右边的内容就行
;
; 想加新语言：复制这个文件，改名成 zh-Hant.ini / en.ini 之类，
; 然后在 app 的偏好里切换。

[app]
name = SilentZIP
tagline = macOS 用アーカイブ管理アプリ

[toolbar]
open = アーカイブを開く
addFiles = 選択した項目を圧縮してアーカイブを作成
addToArchive = 現在のアーカイブにファイルを追加
extract = 選択した項目を解凍
test = 整合性を検査
copy = 選択項目をアーカイブ内の別のパスへコピー
move = 選択項目を移動または名前変更
delete = 選択項目を削除
info = アーカイブ情報を表示

[place]
desktop = デスクトップ
downloads = ダウンロード
documents = 書類
home = ホーム
root = ルート
up = 上の階層へ

[column]
colName = 名前
colType = 種類
colSize = サイズ
colPacked = 圧縮後
colModified = 更新日時
colCRC = CRC

[type]
folder = フォルダ
app = アプリケーション
symlink = シンボリックリンク
archive = アーカイブ

[status]
noArchive = アーカイブを選択するか、ここにドロップしてください
reading = 読み込み中…
extracting = 解凍中…
compressing = 圧縮中…
testing = 検査中…
entries = 件

[menu]
about = SilentZIP について
setDefault = 既定の圧縮ツールに設定
installCLI = コマンドラインツールをインストール…
terms = 使用許諾

[context]
ctxOpen = 開く
openAsArchive = アーカイブとして開く
extractHere = ここに解凍
compress7z = 7z に圧縮…
compressZip = zip に圧縮…
revealInFinder = Finder に表示
moveToTrash = ゴミ箱に入れる
expandNested = 入れ子のアーカイブを開く

[about]
license = 独自使用許諾契約
viewFullTerms = 全文を表示
tech = 技術情報
linkLabel = 全文を表示

[lock]
protected = システムフォルダは保護されているため書き込めません
protectedDelete = システムフォルダは保護されているため削除できません

[error]
noEngine = 7-Zip エンジンが見つかりません
addFailed = 追加に失敗しました
extractFailed = 解凍に失敗しました
openFailed = 開けませんでした
