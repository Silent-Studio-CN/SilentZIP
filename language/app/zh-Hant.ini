; SilentZIP 語言檔 · 繁體中文（台灣）
;
; 格式：key = value
; 分號開頭的是註解，空行會被忽略
; 想改介面文字，直接改等號右邊的內容
;
; 左邊的 key 一個字都不要動。

[app]
name = SilentZIP
tagline = macOS 壓縮檔管理程式

[toolbar]
open = 開啟壓縮檔
addFiles = 將選取的項目壓縮成壓縮檔
addToArchive = 將檔案加入目前的壓縮檔
extract = 解壓縮選取的項目
test = 檢查完整性
copy = 將選取的項目複製到壓縮檔內的其他路徑
move = 移動或重新命名選取的項目
delete = 刪除選取的項目
info = 檢視壓縮檔資訊

[place]
desktop = 桌面
downloads = 下載項目
documents = 文件
home = 個人專屬
root = 根目錄
up = 上一層

[column]
colName = 名稱
colType = 種類
colSize = 大小
colPacked = 壓縮後
colModified = 修改日期
colCRC = CRC

[type]
folder = 檔案夾
app = 應用程式
symlink = 符號連結
archive = 壓縮檔

[status]
noArchive = 選擇一個壓縮檔，或拖曳到這裡
reading = 讀取中…
extracting = 解壓縮中…
compressing = 壓縮中…
testing = 檢查中…
entries = 個項目

[menu]
about = 關於 SilentZIP
setDefault = 設為預設壓縮工具
installCLI = 安裝命令列工具…
terms = 授權條款

[context]
ctxOpen = 開啟
openAsArchive = 以壓縮檔開啟
extractHere = 解壓縮到此處
compress7z = 壓縮為 7z…
compressZip = 壓縮為 zip…
revealInFinder = 在 Finder 中顯示
moveToTrash = 丟到垃圾桶
expandNested = 展開內層壓縮檔

[about]
license = 專屬授權條款
viewFullTerms = 檢視完整條款
tech = 技術
linkLabel = 檢視完整條款

[lock]
protected = 系統檔案夾受保護，無法寫入
protectedDelete = 系統檔案夾受保護，無法刪除

[error]
noEngine = 找不到 7-Zip 引擎
addFailed = 加入失敗
extractFailed = 解壓縮失敗
openFailed = 開啟失敗

