; SilentZIP 语言文件 · 简体中文
;
; 格式：key = value
; 分号开头的行是注释，空行会被忽略
; 想改界面文字，直接改等号右边的内容就行
;
; 想加新语言：复制这个文件，改名成 zh-Hant.ini / en.ini 之类，
; 然后在 app 的偏好里切换。

