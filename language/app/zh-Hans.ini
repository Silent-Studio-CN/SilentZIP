; SilentZIP 语言文件 · 简体中文
;
; 格式：key = value
; 分号开头的行是注释，空行会被忽略
; 想改界面文字，直接改等号右边的内容就行
;
; 想加新语言：复制这个文件，改名成 zh-Hant.ini / en.ini 之类，
; 然后在 app 的偏好里切换。

[app]
name = SilentZIP
tagline = macOS 归档管理器

[toolbar]
open = 打开归档
addFiles = 把选中的文件/文件夹压缩成归档
addToArchive = 往当前归档里添加文件
extract = 解压选中（未选则全部）
test = 测试完整性
copy = 复制选中条目到归档内新路径
move = 移动/重命名选中条目
delete = 删除选中
info = 查看归档信息

[place]
desktop = 桌面
downloads = 下载
documents = 文稿
home = 主目录
root = 根目录
up = 上一级

[column]
colName = 名称
colType = 类型
colSize = 大小
colPacked = 压缩后
colModified = 修改时间
colCRC = CRC

[type]
folder = 文件夹
app = 应用程序
symlink = 符号链接
archive = 压缩包

[status]
noArchive = 选择一个归档文件，或拖进来
reading = 读取中…
extracting = 解压中…
compressing = 压缩中…
testing = 检查中…
entries = 个条目

[menu]
about = 关于 SilentZIP
setDefault = 设为默认压缩工具
installCLI = 安装命令行工具…
terms = 许可协议

[context]
ctxOpen = 打开
openAsArchive = 作为归档查看
extractHere = 解压到此处
compress7z = 压缩为 7z…
compressZip = 压缩为 zip…
revealInFinder = 在 Finder 中显示
moveToTrash = 移到废纸篓
expandNested = 展开嵌套归档

[about]
license = 私有许可协议
viewFullTerms = 查看完整条款
tech = 技术
linkLabel = 查看完整条款

[lock]
protected = 系统目录受保护，不能写入或压缩
protectedDelete = 系统目录受保护，不能删除

[error]
noEngine = 找不到 7-Zip 引擎
addFailed = 添加失败
extractFailed = 解压失败
openFailed = 打开失败
